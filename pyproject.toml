[project]
name = "crosswave"
version = "0.6.1"
description = "CrossWave — AI-Powered Autonomous Company Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.18",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "bcrypt>=4.0.0",
    "itsdangerous>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "hq/tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["app", "hq"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
