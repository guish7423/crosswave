<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周报 · CrossWave HQ</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div id="nav-placeholder"></div>
<div class="content">
    <h1>📊 周报</h1>
    <p class="subtitle">每周一 9:00 自动生成 · 60s 自动刷新</p>

    <div class="kpi-row" id="kpi-row">
        <div class="kpi-card"><div class="kpi-value" id="total-reports">—</div><div class="kpi-label">总报告数</div></div>
        <div class="kpi-card"><div class="kpi-value" id="latest-report">—</div><div class="kpi-label">最新报告</div></div>
    </div>

    <div id="reports-list"></div>
</div>

<script>
const nav = document.getElementById('nav-placeholder');
fetch('/nav.html').then(r=>r.text()).then(h=>{nav.innerHTML=h;document.querySelectorAll('[data-page="reports"]').forEach(e=>e.classList.add('active'));});

async function fetchReports() {
    try {
        const resp = await fetch('/api/hq/weekly-reports');
        const {data} = await resp.json();
        const list = document.getElementById('reports-list');
        document.getElementById('total-reports').textContent = data.length;
        
        if (data.length === 0) {
            list.innerHTML = '<div class="empty-state">暂无周报。下周一 9:00 将自动生成第一份报告。</div>';
            document.getElementById('latest-report').textContent = '—';
            return;
        }

        document.getElementById('latest-report').textContent = data[0].period_start;

        list.innerHTML = data.map(r => `
            <div class="card report-card" onclick="openReport(${r.id})">
                <div class="card-header">
                    <span class="card-title">📅 ${r.period_start} ~ ${r.period_end}</span>
                    <span class="badge">${r.created_at ? r.created_at.slice(0,10) : ''}</span>
                </div>
                <p class="card-desc">${r.summary || '无摘要'}</p>
                <div class="card-meta">
                    <span>📧 ${r.recipient_count || 0} 收件人</span>
                </div>
            </div>
        `).join('');
    } catch(e) {
        document.getElementById('reports-list').innerHTML = '<div class="empty-state">⚠️ 加载失败</div>';
    }
}

function openReport(id) {
    window.open(`/report/${id}`, '_blank');
}

fetchReports();
setInterval(fetchReports, 60000);
</script>
</body>
</html>
