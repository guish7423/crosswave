<script>
const apiBase = 'http://localhost:13001';
let roleChart, statusChart;

async function load() {
  try {
    const res = await fetch(`${apiBase}/api/hq/employees`);
    const data = (await res.json()).data || [];

    const roles = {}, statuses = {};
    data.forEach(e => {
      const r = e.role || e.type || 'unknown';
      roles[r] = (roles[r] || 0) + 1;
      const s = e.status || 'idle';
      statuses[s] = (statuses[s] || 0) + 1;
    });

    const kpiRow = document.getElementById('kpiRow');
    kpiRow.innerHTML = `
      <div class="kpi-card"><div class="label">员工总数</div><div class="value">${data.length}</div></div>
      <div class="kpi-card" style="border-left-color:#4ade80"><div class="label">活跃</div><div class="value">${statuses['active'] || 0}</div></div>
      <div class="kpi-card" style="border-left-color:#60a5fa"><div class="label">空闲</div><div class="value">${statuses['idle'] || 0}</div></div>
      <div class="kpi-card" style="border-left-color:#f87171"><div class="label">错误</div><div class="value">${statuses['error'] || 0}</div></div>
    `;

    if (roleChart) roleChart.destroy();
    roleChart = new Chart(document.getElementById('roleChart'), {
      type: 'doughnut',
      data: { labels: Object.keys(roles), datasets: [{ data: Object.values(roles), backgroundColor: ['#38bdf8','#4ade80','#facc15','#a78bfa','#fb923c','#f472b6'] }] },
      options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8' } } } },
    });

    if (statusChart) statusChart.destroy();
    statusChart = new Chart(document.getElementById('statusChart'), {
      type: 'doughnut',
      data: { labels: Object.keys(statuses), datasets: [{ data: Object.values(statuses), backgroundColor: ['#4ade80','#60a5fa','#f87171','#facc15'] }] },
      options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8' } } } },
    });

    const tbody = document.getElementById('empTable');
    tbody.innerHTML = data.map(e => `
      <tr>
        <td>${e.name || e.agent_type}</td>
        <td>${e.role || '-'}</td>
        <td>${e.type || 'ai'}</td>
        <td><span class="badge ${e.status || 'idle'}">${e.status || 'idle'}</span></td>
        <td>${e.agent_type || '-'}</td>
      </tr>
    `).join('') || '<tr><td colspan="5" class="empty">暂无员工数据</td></tr>';
  } catch (e) {
    document.getElementById('kpiRow').innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}
load();
setInterval(load, 30000);
</script>
