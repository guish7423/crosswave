<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrossWave HQ — 战情室</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="header">
  <h1>🌊 <span>CrossWave</span> HQ</h1>
  <div>
    <span class="sync-info" id="syncInfo"></span>
    <span class="nav">
      <a href="/" class="active">战情室</a>
      <a href="/employees">员工</a>
      <a href="/orders">订单</a>
      <a href="/leads">线索</a>
      <a href="/deploy">部署</a>
      <a href="/finance">财务</a>
      <a href="/monitor">监控</a>
      <a href="/evolution">进化办</a>
    <a href="/reports">报表</a>
    </span>
    <span class="time" id="time"></span>
  </div>
</div>

<div class="kpi-grid" id="kpiGrid">
  <div class="kpi-card"><div class="label">员工数</div><div class="value">—</div><div class="sub" id="empBreakdown"></div></div>
  <div class="kpi-card" style="border-left-color:#4ade80"><div class="label">活跃订单</div><div class="value">—</div><div class="sub" id="orderBreakdown"></div></div>
  <div class="kpi-card" style="border-left-color:#facc15"><div class="label">月收入 (MRR)</div><div class="value">—</div><div class="sub">¥ ARR</div></div>
  <div class="kpi-card" style="border-left-color:#a78bfa"><div class="label">客户数</div><div class="value">—</div><div class="sub">跨业务线</div></div>
  <div class="kpi-card" style="border-left-color:#60a5fa"><div class="label">线索 (Leads)</div><div class="value">—</div><div class="sub" id="leadBreakdown">新: —</div></div>
</div>

<div class="charts-row">
  <div class="chart-card"><h3>👥 员工状态分布</h3><canvas id="empChart"></canvas></div>
  <div class="chart-card"><h3>📊 业务线收入分布</h3><canvas id="revenueChart"></canvas></div>
  <div class="chart-card"><h3>🔵 任务状态分布</h3><canvas id="taskChart"></canvas></div>
</div>

<div class="health-grid" id="healthGrid"></div>

<div class="bottom-row">
  <div class="section-card">
    <h3>🤖 AI 员工</h3>
    <ul class="agent-list" id="agentList"><li class="empty">加载中...</li></ul>
  </div>
  <div class="section-card">
    <h3>📋 最新活动</h3>
    <div class="activity-feed" id="activityFeed"><div class="empty">加载中...</div></div>
  </div>
  <div class="section-card">
    <h3>📩 最新询价</h3>
    <div class="activity-feed" id="leadFeed"><div class="empty">加载中...</div></div>
  </div>
</div>

<script>
function updateTime() { document.getElementById('time').textContent = new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' }); }
setInterval(updateTime, 1000); updateTime();

let empChart, revenueChart, taskChart;
const apiBase = 'http://localhost:13001';

async function loadSummary() {
  try {
    const res = await fetch(`${apiBase}/api/hq/summary`);
    const data = await res.json();

    document.getElementById('syncInfo').textContent = data.last_sync ? `同步: ${new Date(data.last_sync).toLocaleString('zh-CN')}` : '';

    const kpis = document.getElementById('kpiGrid').children;
    kpis[0].querySelector('.value').textContent = data.employees.total;
    const sd = data.employees.status_distribution;
    document.getElementById('empBreakdown').textContent = Object.entries(sd).map(([k,v]) => `${k}: ${v}`).join('  ');
    kpis[1].querySelector('.value').textContent = data.orders.active;
    const od = data.orders.status_distribution;
    document.getElementById('orderBreakdown').textContent = Object.entries(od).map(([k,v]) => `${k}: ${v}`).join('  ');
    kpis[2].querySelector('.value').textContent = `¥${data.mrr.toLocaleString()}`;
    kpis[2].querySelector('.sub').textContent = `¥${(data.mrr * 12).toLocaleString()} ARR`;
    kpis[3].querySelector('.value').textContent = data.customers;
    if (data.leads) {
      kpis[4].querySelector('.value').textContent = data.leads.total;
      document.getElementById('leadBreakdown').textContent = `新: ${data.leads.new}`;
    }

    const empLabels = Object.keys(sd);
    const empValues = Object.values(sd);
    if (empChart) empChart.destroy();
    empChart = new Chart(document.getElementById('empChart'), {
      type: 'doughnut',
      data: { labels: empLabels, datasets: [{ data: empValues, backgroundColor: ['#4ade80','#60a5fa','#f87171','#facc15'] }] },
      options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8' } } } },
    });

    const lineNames = data.lines.map(l => l.name);
    const lineRevenues = data.lines.map(l => l.revenue);
    if (revenueChart) revenueChart.destroy();
    revenueChart = new Chart(document.getElementById('revenueChart'), {
      type: 'doughnut',
      data: { labels: lineNames, datasets: [{ data: lineRevenues.map(r => r || 1), backgroundColor: ['#38bdf8','#4ade80','#facc15','#a78bfa','#fb923c'] }] },
      options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8' } } } },
    });

    const taskLabels = Object.keys(od);
    const taskValues = Object.values(od);
    if (taskChart) taskChart.destroy();
    taskChart = new Chart(document.getElementById('taskChart'), {
      type: 'doughnut',
      data: { labels: taskLabels, datasets: [{ data: taskValues, backgroundColor: ['#4ade80','#facc15','#f87171','#60a5fa'] }] },
      options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8' } } } },
    });

    const healthGrid = document.getElementById('healthGrid');
    healthGrid.innerHTML = data.lines.map(l => `
      <div class="health-card ${l.health}">
        <div>
          <div class="line-name">${l.name}</div>
          <div class="line-meta">¥${l.revenue.toLocaleString()} MRR · ${l.customers} 客户</div>
        </div>
        <span class="line-status ${l.status}">${l.status}</span>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('kpiGrid').innerHTML = `<div class="error-card">⚠️ 无法连接到 HQ: ${e.message}</div>`;
  }
}

async function loadEmployees() {
  try {
    const res = await fetch(`${apiBase}/api/hq/employees`);
    const data = await res.json();
    const list = document.getElementById('agentList');
    list.innerHTML = (data.data || []).map(e => `
      <li class="agent-item">
        <span class="name">${e.name || e.agent_type}</span>
        <span class="status ${e.status}">${e.role || e.type}</span>
      </li>
    `).join('') || '<li class="empty">暂无员工</li>';
  } catch (e) {
    document.getElementById('agentList').innerHTML = `<li class="empty">Error: ${e.message}</li>`;
  }
}

async function loadActivity() {
  try {
    const res = await fetch(`${apiBase}/api/hq/orders`);
    const data = await res.json();
    const feed = document.getElementById('activityFeed');
    const items = (data.data || []).slice(0, 20);
    feed.innerHTML = items.map(o => `
      <div class="activity-item">
        <span>${o.title || 'Task'}</span>
        <span class="time">${o.status}${o.created_at ? ' · ' + new Date(o.created_at).toLocaleDateString('zh-CN') : ''}</span>
      </div>
    `).join('') || '<div class="empty">暂无活动</div>';
  } catch (e) {
    document.getElementById('activityFeed').innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}

async function loadLeads() {
  try {
    const res = await fetch(`${apiBase}/api/hq/leads`);
    const data = await res.json();
    const items = (data.data || []).slice(0, 10);
    const feed = document.getElementById('leadFeed');
    feed.innerHTML = items.map(l => `
      <div class="activity-item">
        <span><strong>${l.name || '?'}</strong> · ${l.product_interest || '—'}</span>
        <span class="time">${l.status}${l.created_at ? ' · ' + new Date(l.created_at).toLocaleDateString('zh-CN') : ''}</span>
      </div>
    `).join('') || '<div class="empty">暂无询价</div>';
  } catch (e) {
    document.getElementById('leadFeed').innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}

loadSummary(); loadEmployees(); loadActivity(); loadLeads();
setInterval(() => { loadSummary(); loadEmployees(); loadActivity(); loadLeads(); }, 30000);
</script>
</body>
</html>
