<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrossWave HQ — 战情室</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; }
.header { background: linear-gradient(135deg, #1e293b, #0f172a); padding: 24px 32px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-size: 22px; font-weight: 700; }
.header h1 span { color: #38bdf8; }
.header .time { color: #94a3b8; font-size: 13px; }
.header .nav a { color: #94a3b8; font-size: 13px; margin-left: 16px; text-decoration: none; }
.header .nav a:hover { color: #38bdf8; }
.header .sync-info { font-size: 11px; color: #64748b; }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; padding: 24px 32px 16px; }
.kpi-card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; border-left: 4px solid #38bdf8; }
.kpi-card .label { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: .5px; }
.kpi-card .value { font-size: 28px; font-weight: 700; margin-top: 4px; }
.kpi-card .sub { font-size: 12px; margin-top: 4px; color: #94a3b8; }

.charts-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; padding: 0 32px 16px; }
.chart-card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
.chart-card h3 { font-size: 14px; color: #94a3b8; margin-bottom: 12px; }
.chart-card canvas { max-height: 240px; }

.health-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; padding: 0 32px 16px; }
.health-card { background: #1e293b; border-radius: 12px; padding: 16px; border: 1px solid #334155; border-left: 4px solid #4ade80; display: flex; justify-content: space-between; align-items: center; }
.health-card.warning { border-left-color: #facc15; }
.health-card.critical { border-left-color: #f87171; }
.health-card .line-name { font-size: 15px; font-weight: 600; }
.health-card .line-status { font-size: 11px; padding: 2px 8px; border-radius: 8px; }
.health-card .line-status.active { background: #166534; color: #4ade80; }
.health-card .line-status.development { background: #5c3d1a; color: #facc15; }
.health-card .line-status.inactive { background: #5c1a1a; color: #f87171; }
.health-card .line-meta { font-size: 12px; color: #94a3b8; margin-top: 4px; }

.bottom-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 0 32px 24px; }
.plug-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 0 32px 24px; }
.section-card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
.section-card h3 { font-size: 14px; color: #94a3b8; margin-bottom: 12px; }
.agent-list { list-style: none; }
.agent-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #334155; }
.agent-item:last-child { border-bottom: none; }
.agent-item .name { font-size: 14px; }
.agent-item .status { font-size: 12px; padding: 2px 8px; border-radius: 10px; }
.agent-item .status.active { background: #166534; color: #4ade80; }
.agent-item .status.idle { background: #1e3a5f; color: #60a5fa; }
.agent-item .status.error { background: #5c1a1a; color: #f87171; }
.activity-feed { max-height: 300px; overflow-y: auto; }
.activity-item { padding: 6px 0; font-size: 13px; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; }
.activity-item .time { color: #64748b; font-size: 12px; }
.empty { color: #64748b; text-align: center; padding: 24px; font-size: 14px; }
.error-card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #f87171; text-align: center; color: #f87171; }
</style>
</head>
<body>
<div class="header">
  <h1>🌊 <span>CrossWave</span> HQ</h1>
  <div>
    <span class="sync-info" id="syncInfo"></span>
    <span class="nav">
      <a href="/" class="active">战情室</a>
      <a href="/employees">员工</a>
      <a href="/orders">订单</a>
      <a href="/leads">线索</a>
      <a href="/finance">财务</a>
      <a href="/reports">报表</a>
    </span>
    <span id="dashNotif" style="display:none;cursor:pointer;font-size:.82rem;background:rgba(239,68,68,.15);color:#f87171;padding:2px 10px;border-radius:12px" onclick="window.location.href='/leads'"></span>
    <span class="time" id="time"></span>
  </div>
</div>

<div class="kpi-grid" id="kpiGrid">
  <div class="kpi-card"><div class="label">员工数</div><div class="value">—</div><div class="sub" id="empBreakdown"></div></div>
  <div class="kpi-card" style="border-left-color:#4ade80"><div class="label">活跃订单</div><div class="value">—</div><div class="sub" id="orderBreakdown"></div></div>
  <div class="kpi-card" style="border-left-color:#facc15"><div class="label">月收入 (MRR)</div><div class="value">—</div><div class="sub">¥ ARR</div></div>
  <div class="kpi-card" style="border-left-color:#a78bfa"><div class="label">客户数</div><div class="value">—</div><div class="sub">跨业务线</div></div>
  <div class="kpi-card" style="border-left-color:#60a5fa"><div class="label">线索 (Leads)</div><div class="value">—</div><div class="sub" id="leadBreakdown">新: —</div></div>
</div>

<div class="charts-row">
  <div class="chart-card"><h3>👥 员工状态分布</h3><canvas id="empChart"></canvas></div>
  <div class="chart-card"><h3>📊 业务线收入分布</h3><canvas id="revenueChart"></canvas></div>
  <div class="chart-card"><h3>🔵 任务状态分布</h3><canvas id="taskChart"></canvas></div>
</div>

<div class="health-grid" id="healthGrid"></div>

<div class="bottom-row">
  <div class="section-card">
    <h3>🤖 AI 员工</h3>
    <ul class="agent-list" id="agentList"><li class="empty">加载中...</li></ul>
  </div>
  <div class="section-card">
    <h3>📋 最新活动</h3>
    <div class="activity-feed" id="activityFeed"><div class="empty">加载中...</div></div>
  </div>
  <div class="section-card">
    <h3>📩 最新询价</h3>
    <div class="activity-feed" id="leadFeed"><div class="empty">加载中...</div></div>
  </div>
</div>

<div class="plug-row">
  <div class="section-card">
    <h3>🔌 插件状态</h3>
    <div id="pluginList" class="activity-feed"><div class="empty">加载中...</div></div>
  </div>
  <div class="section-card">
    <h3>⚡ 事件流</h3>
    <div id="eventFeed" class="activity-feed"><div class="empty">等待事件...</div></div>
  </div>
</div>

<script>
function updateTime() { document.getElementById('time').textContent = new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' }); }
setInterval(updateTime, 1000); updateTime();
async function loadNotif(){try{const r=await fetch('/hq/api/hq/notifications');const d=await r.json();const b=document.getElementById('dashNotif');if(d.new_leads>0){b.style.display='inline';b.textContent='🔔 '+d.new_leads+' new'}else b.style.display='none'}catch(e){}}
loadNotif();setInterval(loadNotif,15000);

let empChart, revenueChart, taskChart;
const apiBase = '/hq';

async function loadSummary() {
  try {
    const res = await fetch(`${apiBase}/api/hq/summary`);
    const data = await res.json();

    document.getElementById('syncInfo').textContent = data.last_sync ? `同步: ${new Date(data.last_sync).toLocaleString('zh-CN')}` : '';

    const kpis = document.getElementById('kpiGrid').children;
    kpis[0].querySelector('.value').textContent = data.employees.total;
    const sd = data.employees.status_distribution;
    document.getElementById('empBreakdown').textContent = Object.entries(sd).map(([k,v]) => `${k}: ${v}`).join('  ');
    kpis[1].querySelector('.value').textContent = data.orders.active;
    const od = data.orders.status_distribution;
    document.getElementById('orderBreakdown').textContent = Object.entries(od).map(([k,v]) => `${k}: ${v}`).join('  ');
    kpis[2].querySelector('.value').textContent = `¥${data.mrr.toLocaleString()}`;
    kpis[2].querySelector('.sub').textContent = `¥${(data.mrr * 12).toLocaleString()} ARR`;
    kpis[3].querySelector('.value').textContent = data.customers;
    if (data.leads) {
      kpis[4].querySelector('.value').textContent = data.leads.total;
      document.getElementById('leadBreakdown').textContent = `新: ${data.leads.new}`;
    }

    const empLabels = Object.keys(sd);
    const empValues = Object.values(sd);
    if (empChart) empChart.destroy();
    empChart = new Chart(document.getElementById('empChart'), {
      type: 'doughnut',
      data: { labels: empLabels, datasets: [{ data: empValues, backgroundColor: ['#4ade80','#60a5fa','#f87171','#facc15'] }] },
      options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8' } } } },
    });

    const lineNames = data.lines.map(l => l.name);
    const lineRevenues = data.lines.map(l => l.revenue);
    if (revenueChart) revenueChart.destroy();
    revenueChart = new Chart(document.getElementById('revenueChart'), {
      type: 'doughnut',
      data: { labels: lineNames, datasets: [{ data: lineRevenues.map(r => r || 1), backgroundColor: ['#38bdf8','#4ade80','#facc15','#a78bfa','#fb923c'] }] },
      options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8' } } } },
    });

    const taskLabels = Object.keys(od);
    const taskValues = Object.values(od);
    if (taskChart) taskChart.destroy();
    taskChart = new Chart(document.getElementById('taskChart'), {
      type: 'doughnut',
      data: { labels: taskLabels, datasets: [{ data: taskValues, backgroundColor: ['#4ade80','#facc15','#f87171','#60a5fa'] }] },
      options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8' } } } },
    });

    const healthGrid = document.getElementById('healthGrid');
    healthGrid.innerHTML = data.lines.map(l => `
      <div class="health-card ${l.health}">
        <div>
          <div class="line-name">${l.name}</div>
          <div class="line-meta">¥${l.revenue.toLocaleString()} MRR · ${l.customers} 客户</div>
        </div>
        <span class="line-status ${l.status}">${l.status}</span>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('kpiGrid').innerHTML = `<div class="error-card">⚠️ 无法连接到 HQ: ${e.message}</div>`;
  }
}

async function loadEmployees() {
  try {
    const res = await fetch(`${apiBase}/api/hq/employees`);
    const data = await res.json();
    const list = document.getElementById('agentList');
    list.innerHTML = (data.data || []).map(e => `
      <li class="agent-item">
        <span class="name">${e.name || e.agent_type}</span>
        <span class="status ${e.status}">${e.role || e.type}</span>
      </li>
    `).join('') || '<li class="empty">暂无员工</li>';
  } catch (e) {
    document.getElementById('agentList').innerHTML = `<li class="empty">Error: ${e.message}</li>`;
  }
}

async function loadActivity() {
  try {
    const res = await fetch(`${apiBase}/api/hq/orders`);
    const data = await res.json();
    const feed = document.getElementById('activityFeed');
    const items = (data.data || []).slice(0, 20);
    feed.innerHTML = items.map(o => `
      <div class="activity-item">
        <span>${o.title || 'Task'}</span>
        <span class="time">${o.status}${o.created_at ? ' · ' + new Date(o.created_at).toLocaleDateString('zh-CN') : ''}</span>
      </div>
    `).join('') || '<div class="empty">暂无活动</div>';
  } catch (e) {
    document.getElementById('activityFeed').innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}

async function loadLeads() {
  try {
    const res = await fetch(`${apiBase}/api/hq/leads`);
    const data = await res.json();
    const items = (data.data || []).slice(0, 10);
    const feed = document.getElementById('leadFeed');
    feed.innerHTML = items.map(l => `
      <div class="activity-item">
        <span><strong>${l.name || '?'}</strong> · ${l.product_interest || '—'}</span>
        <span class="time">${l.status}${l.created_at ? ' · ' + new Date(l.created_at).toLocaleDateString('zh-CN') : ''}</span>
      </div>
    `).join('') || '<div class="empty">暂无询价</div>';
  } catch (e) {
    document.getElementById('leadFeed').innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}

async function loadPlugins() {
  try {
    const res = await fetch(`${apiBase}/api/hq/plugins`);
    const data = await res.json();
    const list = document.getElementById('pluginList');
    const plugins = data.plugins || data || [];
    list.innerHTML = (Array.isArray(plugins) ? plugins : []).map(p => `
      <div class="activity-item">
        <span><strong>${p.name}</strong> · ${p.description || '—'}</span>
        <span class="time">${p.status}${p.last_heartbeat ? ' · ♥' + new Date(p.last_heartbeat).toLocaleTimeString('zh-CN') : ''}</span>
      </div>
    `).join('') || '<div class="empty">暂无插件</div>';
  } catch (e) {
    document.getElementById('pluginList').innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}

function addEventItem(text) {
  const feed = document.getElementById('eventFeed');
  const item = document.createElement('div');
  item.className = 'activity-item';
  item.innerHTML = `<span>${text}</span><span class="time">${new Date().toLocaleTimeString('zh-CN')}</span>`;
  feed.insertBefore(item, feed.firstChild);
  while (feed.children.length > 50) feed.removeChild(feed.lastChild);
}

loadSummary(); loadEmployees(); loadActivity(); loadLeads(); loadPlugins();

// Polling fallback (every 30s)
setInterval(() => { loadSummary(); loadEmployees(); loadActivity(); loadLeads(); loadPlugins(); }, 30000);

// SSE real-time updates
const evtSource = new EventSource('/hq/api/hq/events');
evtSource.onmessage = (e) => {
  try {
    const data = JSON.parse(e.data);
    if (data.type === 'heartbeat') {
      document.getElementById('syncInfo').textContent = `SSE: ${new Date(data.timestamp).toLocaleTimeString('zh-CN')}`;
      if (!document.hidden) { loadSummary(); }
    } else if (data.type === 'plugin_heartbeat') {
      addEventItem(`♥ ${data.plugin_name} heartbeat`);
      if (!document.hidden) { loadPlugins(); }
    } else if (data.type === 'plugin_registered' || data.type === 'plugin_unregistered') {
      addEventItem(`${data.type === 'plugin_registered' ? '➕' : '➖'} ${data.plugin_name}`);
      if (!document.hidden) { loadPlugins(); }
    } else {
      addEventItem(`📨 ${data.type}${data.plugin_name ? ' (' + data.plugin_name + ')' : ''}`);
    }
  } catch (_) {}
};
</script>
</body>
</html>
