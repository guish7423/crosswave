async function scanPlatform(platform) {
  try {
    const res = await fetch(`http://localhost:8001/api/v1/orders/external/scan/${platform}`, {
      headers: { 'X-API-Key': 'dev-key' },
    });
    const result = await res.json();
    if (result.new_orders > 0) {
      await fetch(`${apiBase}/api/hq/sync`);
    }
    alert(`扫描 ${platform} 完成，发现 ${result.new_orders} 个新订单！`);
    loadExternalOrders();
  } catch (e) {
    alert(`扫描失败: ${e.message}`);
  }
}

async function evalOrder(orderId) {
  try {
    const res = await fetch(`http://localhost:8001/api/v1/orders/external/${orderId}/evaluate`, {
      method: 'POST',
      headers: { 'X-API-Key': 'dev-key' },
    });
    const result = await res.json();
    await fetch(`${apiBase}/api/hq/sync`);
    alert(`评估完成 — 评分: ${result.score}/10\n${result.reason}`);
    loadExternalOrders();
  } catch (e) {
    alert(`评估失败: ${e.message}`);
  }
}

async function fulfillOrder(orderId) {
  try {
    const res = await fetch(`http://localhost:8001/api/v1/orders/external/${orderId}/fulfill`, {
      method: 'POST',
      headers: { 'X-API-Key': 'dev-key' },
    });
    const result = await res.json();
    await fetch(`${apiBase}/api/hq/sync`);
    alert(`执行完成！已创建 ${result.subtasks_created} 个子任务。`);
    loadExternalOrders();
  } catch (e) {
    alert(`执行失败: ${e.message}`);
  }
}
