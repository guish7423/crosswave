<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrossWave HQ — 订单中心</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; }
.header { background: linear-gradient(135deg, #1e293b, #0f172a); padding: 24px 32px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-size: 22px; font-weight: 700; }
.header h1 span { color: #38bdf8; }
.header .nav a { color: #94a3b8; font-size: 13px; margin-left: 16px; text-decoration: none; }
.header .nav a:hover { color: #38bdf8; }

.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 24px 32px 16px; }
.kpi-card { background: #1e293b; border-radius: 12px; padding: 16px; border: 1px solid #334155; border-left: 4px solid #38bdf8; }
.kpi-card .label { font-size: 11px; color: #94a3b8; text-transform: uppercase; }
.kpi-card .value { font-size: 24px; font-weight: 700; margin-top: 4px; }

.filters { padding: 0 32px 16px; display: flex; gap: 12px; }
.filters select, .filters input { background: #1e293b; border: 1px solid #334155; color: #e2e8f0; padding: 8px 12px; border-radius: 8px; font-size: 13px; }

.table-wrap { padding: 0 32px 24px; }
table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 12px; overflow: hidden; }
th { background: #0f172a; color: #94a3b8; font-size: 12px; text-transform: uppercase; padding: 12px 16px; text-align: left; }
td { padding: 10px 16px; border-bottom: 1px solid #334155; font-size: 14px; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #1a2744; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 8px; }
.badge.completed { background: #166534; color: #4ade80; }
.badge.pending { background: #5c3d1a; color: #facc15; }
.badge.in_progress { background: #1e3a5f; color: #60a5fa; }
.badge.failed { background: #5c1a1a; color: #f87171; }

.platforms { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; padding: 0 32px 16px; }
.platform-card { background: #1e293b; border-radius: 10px; padding: 16px; border: 1px solid #334155; border-left: 4px solid #94a3b8; text-align: center; }
.platform-card .platform-name { font-size: 15px; font-weight: 600; }
.platform-card .platform-status { font-size: 11px; margin-top: 6px; padding: 2px 10px; border-radius: 8px; display: inline-block; }
.platform-card .platform-status.connected { background: #166534; color: #4ade80; }
.platform-card .platform-status.disconnected { background: #5c1a1a; color: #f87171; }

.empty { color: #64748b; text-align: center; padding: 40px; }
</style>
</head>
<body>
<div class="header">
  <h1>🌊 <span>CrossWave</span> HQ · 订单中心</h1>
  <span class="nav">
    <a href="/">战情室</a>
    <a href="/employees">员工</a>
    <a href="/finance">财务</a>
    <a href="/reports">报表</a>
  </span>
</div>

<div class="kpi-row" id="kpiRow"></div>

<div class="filters">
  <select id="platformFilter" onchange="loadOrders()"><option value="">全部平台</option><option value="internal">内部</option><option value="upwork">Upwork</option><option value="fiverr">Fiverr</option></select>
  <select id="statusFilter" onchange="loadOrders()"><option value="">全部状态</option><option value="pending">待处理</option><option value="in_progress">进行中</option><option value="completed">已完成</option><option value="failed">失败</option></select>
</div>

<h3 style="padding:0 32px 8px;font-size:13px;color:#94a3b8;">🔌 平台连接</h3>
<div class="platforms" id="platformGrid"></div>

<div class="table-wrap">
  <table>
    <thead><tr><th>标题</th><th>平台</th><th>状态</th><th>时间</th></tr></thead>
    <tbody id="orderTable"></tbody>
  </table>
</div>

<script>
const apiBase = 'http://localhost:13001';

async function loadOrders() {
  try {
    const platform = document.getElementById('platformFilter').value;
    const status = document.getElementById('statusFilter').value;
    const params = new URLSearchParams();
    if (platform) params.set('platform', platform);
    if (status) params.set('status', status);
    const res = await fetch(`${apiBase}/api/hq/orders?${params}`);
    const data = (await res.json()).data || [];

    const total = data.length;
    const pending = data.filter(o => o.status === 'pending').length;
    const inProgress = data.filter(o => o.status === 'in_progress').length;
    const done = data.filter(o => o.status === 'completed').length;

    document.getElementById('kpiRow').innerHTML = `
      <div class="kpi-card"><div class="label">订单总数</div><div class="value">${total}</div></div>
      <div class="kpi-card" style="border-left-color:#facc15"><div class="label">待处理</div><div class="value">${pending}</div></div>
      <div class="kpi-card" style="border-left-color:#60a5fa"><div class="label">进行中</div><div class="value">${inProgress}</div></div>
      <div class="kpi-card" style="border-left-color:#4ade80"><div class="label">已完成</div><div class="value">${done}</div></div>
    `;

    const tbody = document.getElementById('orderTable');
    tbody.innerHTML = data.map(o => `
      <tr>
        <td>${o.title || '未命名'}</td>
        <td>${o.platform || '-'}</td>
        <td><span class="badge ${o.status || 'pending'}">${o.status || 'pending'}</span></td>
        <td style="color:#94a3b8;font-size:12px;">${o.created_at ? new Date(o.created_at).toLocaleString('zh-CN') : '-'}</td>
      </tr>
    `).join('') || '<tr><td colspan="4" class="empty">暂无订单</td></tr>';
  } catch (e) {
    document.getElementById('kpiRow').innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}

async function loadPlatforms() {
  const platforms = [
    { name: '内部系统', status: 'connected', desc: 'Polsia Fork 任务' },
    { name: 'Upwork', status: 'disconnected', desc: 'MCP 集成' },
    { name: 'Fiverr', status: 'disconnected', desc: 'Apify 集成' },
    { name: '猪八戒', status: 'disconnected', desc: '抢单宝 API' },
  ];
  const grid = document.getElementById('platformGrid');
  grid.innerHTML = platforms.map(p => `
    <div class="platform-card">
      <div class="platform-name">${p.name}</div>
      <div class="platform-status ${p.status}">${p.status === 'connected' ? '已连接' : '未连接'}</div>
      <div style="font-size:11px;color:#64748b;margin-top:4px;">${p.desc}</div>
    </div>
  `).join('');
}

loadOrders();
loadPlatforms();
setInterval(loadOrders, 30000);
</script>
</body>
</html>
