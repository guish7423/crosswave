<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>模型路由 - CrossWave HQ</title>
<link rel="stylesheet" href="/static/styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  .model-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
  .model-card .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .model-card .name{font-size:16px;font-weight:600;color:var(--text-primary)}
  .badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
  .badge.online{background:rgba(34,197,94,.15);color:#22c55e}
  .badge.offline{background:rgba(239,68,68,.15);color:#ef4444}
  .badge.mock{background:rgba(100,116,139,.15);color:#94a3b8}
  .cap-tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;background:var(--bg-hover);color:var(--text-secondary);margin:2px 4px 2px 0}
  .key-preview{font-family:monospace;font-size:13px;color:var(--text-secondary)}
  .route-table{width:100%;border-collapse:collapse;font-size:14px}
  .route-table th,.route-table td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border)}
  .route-table th{color:var(--text-secondary);font-weight:500;font-size:12px;text-transform:uppercase}
  .route-table tr:hover{background:var(--bg-hover)}
  .agent-emoji{font-size:18px;margin-right:6px}
  pre.test-result{background:#1a1a2e;color:#e2e8f0;padding:12px;border-radius:8px;font-size:12px;overflow-x:auto;margin-top:8px}
  .test-btn{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);cursor:pointer;font-size:13px;transition:all .2s}
  .test-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .test-btn:disabled{opacity:.5;cursor:not-allowed}
  .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
  .status-dot.online{background:#22c55e}
  .status-dot.offline{background:#ef4444}
  .status-dot.mock{background:#94a3b8}
</style>
</head>
<body>

<div id="nav-placeholder"></div>
<script>fetch('/static/nav.html').then(r=>r.text()).then(h=>document.getElementById('nav-placeholder').innerHTML=h)</script>

<main class="container" style="max-width:1200px;margin:0 auto;padding:24px">
  <h1 style="margin-bottom:4px">🧠 模型路由网关</h1>
  <p style="color:var(--text-secondary);margin-bottom:24px">AI 模型路由 · 自动按任务类型分配最优模型 · 故障降级</p>

  <!-- KPI row -->
  <div class="kpi-row" id="kpi-row">
    <div class="kpi-card"><div class="kpi-value" id="kpi-total">—</div><div class="kpi-label">模型总数</div></div>
    <div class="kpi-card"><div class="kpi-value" id="kpi-available">—</div><div class="kpi-label">可用</div></div>
    <div class="kpi-card"><div class="kpi-value" id="kpi-offline">—</div><div class="kpi-label">不可用</div></div>
    <div class="kpi-card"><div class="kpi-value" id="kpi-agents">—</div><div class="kpi-label">Agent 类型</div></div>
    <div class="kpi-card"><div class="kpi-value" id="kpi-categories">—</div><div class="kpi-label">任务类别</div></div>
  </div>

  <!-- Model profiles -->
  <h2 style="margin:20px 0 12px">📡 模型配置</h2>
  <div id="model-list"></div>

  <!-- Agent routing table -->
  <h2 style="margin:24px 0 12px">🔀 Agent → 模型路由</h2>
  <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;overflow:hidden">
    <table class="route-table">
      <thead><tr><th>Agent</th><th>任务类别</th><th>首选模型</th><th>操作</th></tr></thead>
      <tbody id="route-tbody"></tbody>
    </table>
  </div>

  <!-- Test result -->
  <div id="test-result" style="display:none;margin-top:16px"></div>
</main>

<script>
const emoji = {analysis:'📊', content_gen:'✍️', code:'💻', classification:'🎯', summarization:'📋', conversation:'💬'};
const agentEmoji = {orchestrator:'🎭', social_media:'📱', competitor_research:'🔍', business_planning:'📈', deployment:'🚀', finance:'💰', ads_management:'📢', email_outreach:'📧', code_generation:'⚙️', customer_support:'🤝', order_scanner:'🔎', order_fulfiller:'✅', lead_nurturing:'🌱', deploy_agent:'🛠️', monitor:'👁️', evolution:'🧬', market_intel:'🌍'};
const categoryOrder = ['analysis','content_gen','code','classification','summarization','conversation'];

async function load(){
  try {
    const r = await fetch('/api/hq/models');
    const d = await r.json();
    renderModels(d.profiles);
    renderRouting(d.profiles, d.agent_mapping);
    renderKPI(d.profiles, d.agent_mapping);
  } catch(e){ document.getElementById('model-list').innerHTML=`<div class="model-card">❌ 加载失败: ${e.message}</div>`; }
}

function renderKPI(profiles, mapping){
  const avail = profiles.filter(p => p.available || !p.env).length;
  const offline = profiles.length - avail;
  const cats = new Set(Object.values(mapping));
  document.getElementById('kpi-total').textContent = profiles.length;
  document.getElementById('kpi-available').textContent = avail;
  document.getElementById('kpi-offline').textContent = offline;
  document.getElementById('kpi-agents').textContent = Object.keys(mapping).length;
  document.getElementById('kpi-categories').textContent = cats.size;
}

function renderModels(profiles){
  const html = profiles.map(p => {
    const isAvail = p.available || !p.env;
    const badge = !p.env ? 'mock' : (isAvail ? 'online' : 'offline');
    const badgeLabel = !p.env ? 'Mock' : (isAvail ? '✅ 可用' : '❌ 不可用');
    return `<div class="model-card">
      <div class="header">
        <div><span class="name">${p.name}</span> <span class="badge ${badge}">${badgeLabel}</span></div>
        <div><span class="key-preview">${p.key_preview}</span></div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;font-size:13px;color:var(--text-secondary)">
        <span>模型: <code>${p.model}</code></span>
        <span>优先级: ${p.priority}</span>
        <span>端点: <code>${p.base_url || '-'}</code></span>
      </div>
      <div>${p.capabilities.map(c => `<span class="cap-tag">${emoji[c]||''} ${c}</span>`).join('')}</div>
      <div style="margin-top:10px"><button class="test-btn" onclick="testModel('${p.name}','${p.env}','${p.base_url}','${p.model}')">🧪 测试</button></div>
    </div>`;
  }).join('');
  document.getElementById('model-list').innerHTML = html;
}

function renderRouting(profiles, mapping){
  const sorted = Object.entries(mapping).sort((a,b) => categoryOrder.indexOf(a[1]) - categoryOrder.indexOf(b[1]) || a[0].localeCompare(b[0]));
  const html = sorted.map(([agent, cat]) => {
    const best = profiles.filter(p => p.capabilities.includes(cat) && (p.available || !p.env));
    const primary = best.length ? best[0].name : '—';
    return `<tr><td>${agentEmoji[agent]||'🤖'} ${agent}</td><td><span class="cap-tag">${emoji[cat]||''} ${cat}</span></td><td>${primary}</td><td><button class="test-btn" onclick="testAgent('${agent}')">🧪 触发</button></td></tr>`;
  }).join('');
  document.getElementById('route-tbody').innerHTML = html;
}

async function testModel(name, env, baseUrl, model){
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = '⏳ 测试中…';
  const div = document.getElementById('test-result');
  div.style.display = 'block';
  div.innerHTML = `<div class="model-card"><h3>🧪 测试: ${name}</h3><pre class="test-result">请求中…</pre></div>`;
  try {
    const r = await fetch('/api/hq/models');
    const d = await r.json();
    const profile = d.profiles.find(p => p.name === name);
    div.innerHTML = `<div class="model-card"><h3>🧪 测试: ${name}</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;color:var(--text-secondary)">
        <span>状态: ${profile.available ? '✅ 可用' : '❌ Key 未配置'}</span>
        <span>模型: ${model}</span>
        <span>优先级: ${profile.priority}</span>
        <span>端点数: ${profile.base_url || '-'}</span>
      </div>
      <div style="margin-top:8px">能力: ${profile.capabilities.map(c => `<span class="cap-tag">${c}</span>`).join('')}</div>
    </div>`;
  } catch(e){ div.innerHTML = `<div class="model-card">❌ ${e.message}</div>`; }
  btn.disabled = false;
  btn.textContent = '🧪 测试';
}

async function testAgent(agentType){
  const resultDiv = document.getElementById('test-result');
  resultDiv.style.display = 'block';
  resultDiv.innerHTML = `<div class="model-card"><h3>⏳ 触发 ${agentType}…</h3><pre class="test-result">请求中…</pre></div>`;
  try {
    const r = await fetch(`/api/hq/agents/${agentType}/trigger`, {method:'POST'});
    const data = await r.json();
    resultDiv.innerHTML = `<div class="model-card"><h3>✅ ${agentType} 已触发</h3><pre class="test-result">${JSON.stringify(data,null,2)}</pre></div>`;
  } catch(e){
    resultDiv.innerHTML = `<div class="model-card"><h3>❌ 触发失败</h3><pre class="test-result">${e.message}</pre></div>`;
  }
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
