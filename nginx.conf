# ═══════════════════════════════════════════════════════════
# CrossWave — Production Nginx Configuration
# SSL + Security Headers + Rate Limiting + Proxy
# ═══════════════════════════════════════════════════════════

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Basic Security / Performance ─────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 10m;

    # ── Rate Limiting ────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=crosswave:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=10r/s;

    # ── SSL Session Cache ────────────────────────────────
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Upstream Services ────────────────────────────────
    upstream crosswave_upstream { server crosswave:9999; }
    upstream hq_upstream        { server crosswave:13001; }
    upstream blog_upstream      { server crossblog:8000; }

    # ── HTTP → HTTPS Redirect ───────────────────────────
    server {
        listen 80;
        server_name crosswave.app www.crosswave.app blog.crosswave.app;
        return 301 https://$server_name$request_uri;
    }

    # ── CrossWave Main + HQ ──────────────────────────────
    server {
        listen 443 ssl http2;
        server_name crosswave.app www.crosswave.app;

        # SSL (mount certs at /etc/nginx/ssl/)
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # ── Security Headers ─────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.github.com; frame-src 'none'; object-src 'none'" always;

        # ── HQ Backend (sub-path) ────────────────────────
        location /hq/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://hq_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── API endpoints ────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://crosswave_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Stripe Webhook (separate rate limit) ────────
        location /api/v1/stripe/ {
            limit_req zone=webhook burst=5 nodelay;
            proxy_pass http://polsia-fork:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Static Assets (cache) ────────────────────────
        location /static/ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            proxy_pass http://crosswave_upstream;
        }

        # ── WebSocket (Dashboard real-time) ──────────────
        location /ws {
            proxy_pass http://crosswave_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }

        # ── Main App ──────────────────────────────────────
        location / {
            limit_req zone=crosswave burst=30 nodelay;
            proxy_pass http://crosswave_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Health Check (no rate limit) ─────────────────
        location /health {
            access_log off;
            proxy_pass http://crosswave_upstream;
        }
    }

    # ── CrossBlog Subdomain ───────────────────────────────
    server {
        listen 443 ssl http2;
        server_name blog.crosswave.app;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            proxy_pass http://blog_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── www → root redirect ─────────────────────────────
    server {
        listen 443 ssl http2;
        server_name ~^www\.(.+)$;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        return 301 $scheme://$1$request_uri;
    }
}
