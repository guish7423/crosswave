events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 上游服务
    upstream crosswave_upstream { server crosswave:9999; }
    upstream hq_upstream { server crosswave:13001; }
    upstream blog_upstream { server crossblog:8000; }

    # CrossWave 主站 + HQ 后台
    server {
        listen 80;
        server_name crosswave.app www.crosswave.app;

        # HQ 后台 (/hq/* → Bridge 端口)
        location /hq/ {
            proxy_pass http://hq_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 主站
        location / {
            proxy_pass http://crosswave_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket (Dashboard 实时)
        location /ws {
            proxy_pass http://crosswave_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # CrossBlog 子域名
    server {
        listen 80;
        server_name blog.crosswave.app;

        location / {
            proxy_pass http://blog_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 重定向 www → root
    server {
        listen 80;
        server_name ~^www\.(.+)$;
        return 301 $scheme://$1$request_uri;
    }
}
